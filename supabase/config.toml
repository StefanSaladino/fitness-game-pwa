# Deterministic local/CI Supabase configuration.
# This file contains no production credentials.
project_id = "fitness-game-pwa"

[db]
# Hosted project verified on PostgreSQL 17.6 before this CI lock was created.
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/reset-password",
]

[functions.platform-capacity-supabase]
# The function is called by authenticated administrators and must receive a real
# user JWT. Provider credentials remain server-side secrets and never authorize
# the incoming browser request by themselves.
verify_jwt = true

[functions.platform-capacity-netlify]
# Same authorization boundary as the Supabase provider adapter: a real signed-in
# user JWT reaches the function, then platform-admin access is re-checked inside.
verify_jwt = true
