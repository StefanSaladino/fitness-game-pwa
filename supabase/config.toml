# Deterministic repository Supabase configuration.
# This file contains no production credentials and the supported validation workflow is hosted-first/no-Docker.
project_id = "fitness-game-pwa"

[db]
# Hosted project verified on PostgreSQL 17.6 before this CI lock was created.
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/reset-password",
]

[auth.email.template.confirmation]
subject = "Confirm your Top Set account"
content_path = "./supabase/templates/confirmation.html"

[functions.platform-capacity-supabase]
# The function is called by authenticated administrators and must receive a real
# user JWT. Provider credentials remain server-side secrets and never authorize
# the incoming browser request by themselves.
verify_jwt = true


[functions.platform-account-auth]
# Suspension/restore reaches Supabase Auth Admin only after the caller JWT and
# ACTIVE platform-admin state are verified inside the function. The service-role
# key is a hosted Edge Function secret and is never exposed to the PWA.
verify_jwt = true

[functions.push-notifications]
# Background pg_net/cron dispatch cannot carry an end-user JWT, so the platform
# verifier is disabled for this one function. The function manually accepts only
# (a) a verified ACTIVE user JWT for GET_PUBLIC_KEY or (b) the server-only random
# dispatch credential stored in private database state for DRAIN. VAPID private
# key material and the dispatch token never enter Vite/browser code.
verify_jwt = false
