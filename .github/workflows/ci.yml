name: Clean stale remote branches

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance/stale-branch-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify master exists
        shell: bash
        run: |
          git ls-remote --exit-code --heads origin refs/heads/master >/dev/null
      - name: Delete stale branches
        shell: bash
        run: |
          git push origin --delete phase15.8-training-content
          git push origin --delete phase16.0-visual-inventory-v2
          git push origin --delete maintenance/stale-branch-cleanup
