name: CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Shell consistency validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit visible Back labels
        run: |
          python - <<'PY'
          import pathlib, re, sys
          matches = []
          for path in pathlib.Path('src').rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), 1):
                  if re.search(r'>[^<{]*\bBack\b[^<{]*<', line):
                      matches.append(f'{path}:{line_no}:{line.strip()}')
          if matches:
              print('\n'.join(matches))
              sys.exit('Visible Back labels remain.')
          print('Visible Back label audit passed.')
          PY

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:structure

      - name: Install mobile browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser regression suite
        run: npm run test:e2e
