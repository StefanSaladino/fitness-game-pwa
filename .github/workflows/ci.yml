name: CI

on:
  push:
    branches:
      - phase15.7-optional-multigroup-entry

permissions:
  contents: write

jobs:
  cleanup-stale-branches:
    name: Prune stale remote branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase15.7-optional-multigroup-entry
          fetch-depth: 0
      - name: Delete stale remote branches
        run: |
          git push origin --delete phase16.0-visual-inventory
          git push origin --delete phase15.7-optional-multi-groups
          git push origin --delete phase15.7-optional-multigroup-entry
