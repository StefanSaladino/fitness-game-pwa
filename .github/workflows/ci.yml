name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance-cleanup:
    name: Maintenance assertion cleanup
    if: github.head_ref == 'maintenance/stale-assertion-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/stale-assertion-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reconcile stale assertions
        run: |
          node scripts/maintenance-stale-assertions.cjs
          node scripts/maintenance-stale-assertions-patch2.cjs
      - name: Validate reconciled structural suite
        run: npm run test:structure
      - name: Commit cleaned tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: remove stale structural assertions"
          git push origin HEAD:maintenance/stale-assertion-cleanup
