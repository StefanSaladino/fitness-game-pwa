name: Clean stale remote branches

on:
  push:
    branches:
      - phase16.0-visual-inventory-v2

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and superseded branches
        shell: bash
        run: |
          git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/master >/dev/null
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --delete phase15.8-training-content phase16.0-visual-inventory-v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
