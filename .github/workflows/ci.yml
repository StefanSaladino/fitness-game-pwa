name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: if [ ! -f supabase/config.toml ]; then npx supabase init; fi
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npx supabase db lint --level warning
      - if: always()
        run: npx supabase stop --no-backup
