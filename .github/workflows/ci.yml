name: CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full pre-deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Structure and hosting checks
        run: npm run test:structure

      - name: Internal checks
        run: npm run test:internal

      - name: Database contract checks
        run: npm run db:test:ci

      - name: Live confirmation bridge smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ijkmevahyojfkxqykcjp.supabase.co/functions/v1/confirm-signup'
          TOKEN='abcdefghijklmnopqrstuvwxyz123456'

          assert_redirect() {
            local redirect_to="$1"
            local expected="$2"
            local headers
            headers="$(mktemp)"
            curl -sS -D "$headers" -o /dev/null -G "$BASE" \
              --data-urlencode "token_hash=$TOKEN" \
              --data-urlencode "redirect_to=$redirect_to"
            grep -Eq '^HTTP/.* 303' "$headers"
            tr -d '\r' < "$headers" | grep -Fxi "location: $expected"
          }

          PROD="https://topset2026.netlify.app/confirm-signup?token_hash=$TOKEN&type=email"

          assert_redirect \
            'https://topset2026.netlify.app/confirm-signup' \
            "$PROD"

          assert_redirect \
            'http://localhost:5173/confirm-signup' \
            "http://localhost:5173/confirm-signup?token_hash=$TOKEN&type=email"

          assert_redirect \
            'http://localhost:5174/confirm-signup' \
            "$PROD"

          assert_redirect \
            'http://127.0.0.1:5173/confirm-signup' \
            "$PROD"

          assert_redirect \
            'https://evil.example/confirm-signup' \
            "$PROD"

          assert_redirect \
            'https://topset2026.netlify.app/' \
            "$PROD"

          assert_redirect \
            'https://deploy-preview-42--topset2026.netlify.app/confirm-signup' \
            "https://deploy-preview-42--topset2026.netlify.app/confirm-signup?token_hash=$TOKEN&type=email"

          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null -G "$BASE" --data-urlencode "token_hash=$TOKEN"
          grep -Eq '^HTTP/.* 303' "$headers"
          tr -d '\r' < "$headers" | grep -Fxi "location: $PROD"

          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null -G "$BASE" --data-urlencode 'token_hash=bad'
          grep -Eq '^HTTP/.* 303' "$headers"
          tr -d '\r' < "$headers" | grep -Fxi 'location: https://topset2026.netlify.app/confirm-signup'

          headers="$(mktemp)"
          curl -sS -I -D "$headers" -o /dev/null "$BASE"
          grep -Eq '^HTTP/.* 200' "$headers"
          if tr -d '\r' < "$headers" | grep -Eqi '^location:'; then
            echo 'HEAD unexpectedly redirected'
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e
