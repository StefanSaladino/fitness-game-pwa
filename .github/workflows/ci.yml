name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase152b_finalize:
    name: Phase 15.2B exact-hash finalizer
    if: github.event_name == 'pull_request' && github.head_ref == 'phase15-2b-finalize-trigger'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply exact roadmap and validator finalization
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/phase15.2b-finalize.patch
          git apply .github/phase15.2b-finalize.patch
          test "$(git hash-object docs/ROADMAP.md)" = "c0fd72ef0ad369dc124d1c1a8934787736da2cea"
          test "$(git hash-object scripts/validate-project-clean.cjs)" = "54b7f1e7339393e4663ebf4162d3627e6cb92942"
          rm .github/phase15.2b-finalize.patch
          rm .github/workflows/finalize-phase15.2b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md scripts/validate-project-clean.cjs .github/phase15.2b-finalize.patch .github/workflows/finalize-phase15.2b.yml
          git commit -m "chore: finalize phase 15.2B roadmap validation"
          git push origin HEAD:master

  application:
    name: Application gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:structure
      - run: npm run test:internal

  browser:
    name: Browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  database:
    name: Database gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase stack
        run: npx supabase start
      - name: Rebuild database from migration zero
        run: npx supabase db reset
      - name: Run canonical pgTAP suites only
        run: npm run db:test:local
      - name: Report database lint findings
        run: npx supabase db lint --level warning
      - if: always()
        name: Stop isolated Supabase stack
        run: npx supabase stop --no-backup
