name: Maintenance stale assertion cleanup

on:
  push:
    branches:
      - maintenance/stale-assertion-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/stale-assertion-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rewrite stale structural assertions
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, text) {
            fs.writeFileSync(file, text);
          }

          function replaceOnce(file, before, after) {
            const text = read(file);
            const first = text.indexOf(before);
            const second = first === -1 ? -1 : text.indexOf(before, first + before.length);
            if (first === -1 || second !== -1) {
              throw new Error(`${file}: expected exactly one match for replacement:\n${before}`);
            }
            write(file, text.slice(0, first) + after + text.slice(first + before.length));
          }

          function replaceSection(file, startMarker, endMarker, replacement) {
            const text = read(file);
            const start = text.indexOf(startMarker);
            const end = start === -1 ? -1 : text.indexOf(endMarker, start);
            if (start === -1 || end === -1) {
              throw new Error(`${file}: unable to locate section markers`);
            }
            const endAfter = end + endMarker.length;
            write(file, text.slice(0, start) + replacement + text.slice(endAfter));
          }

          function replaceToEnd(file, startMarker, replacement) {
            const text = read(file);
            const start = text.indexOf(startMarker);
            if (start === -1) throw new Error(`${file}: unable to locate tail marker`);
            write(file, text.slice(0, start) + replacement);
          }

          const oldValidator = 'scripts/validate-project.cjs';
          replaceOnce(
            oldValidator,
            "  'supabase/migrations/20260822000200_fix_lifting_calendar_summaries.sql',\n",
            '',
          );
          replaceOnce(
            oldValidator,
            "const phase13bRepairMigration = read('supabase/migrations/20260822000200_fix_lifting_calendar_summaries.sql');\n",
            '',
          );
          replaceOnce(
            oldValidator,
            "ok(/create or replace function public\\.get_my_lifting_calendar_summaries/.test(phase13bRepairMigration) && /gs\\.bucket_start/.test(phase13bRepairMigration) && !/\\bperiod_start::date as period_start\\b/.test(phase13bRepairMigration), 'Phase 13B repair migration removes PL/pgSQL output-variable ambiguity from generated calendar buckets');\nok(/bucket_start/.test(phase13bRepairMigration) && /bucket_end/.test(phase13bRepairMigration) && /session_total/.test(phase13bRepairMigration) && /pr_total/.test(phase13bRepairMigration), 'Phase 13B repair keeps internal aggregate names distinct from RETURNS TABLE output variables');",
            "ok(/gs\\.bucket_start/.test(phase13bMigration) && !/\\bperiod_start::date as period_start\\b/.test(phase13bMigration), 'Phase 13B primary migration keeps generated calendar buckets unambiguous');\nok(/bucket_start/.test(phase13bMigration) && /bucket_end/.test(phase13bMigration) && /session_total/.test(phase13bMigration) && /pr_total/.test(phase13bMigration), 'Phase 13B primary migration keeps internal aggregate names distinct from RETURNS TABLE output variables');",
          );
          replaceOnce(
            oldValidator,
            "ok(packageJson.version === '0.12.1' && packageLockJson.version === '0.12.1', 'project metadata records v0.12.1');",
            "ok(versionAtLeast(packageJson.version, '0.13.0') && versionAtLeast(packageLockJson.version, '0.13.0'), 'project metadata is at or beyond v0.13.0');",
          );
          replaceOnce(
            oldValidator,
            "ok(/CACHE_PREFIX = 'workout-game-shell-'/.test(phase12bSw) && /v12b-2/.test(phase12bSw), 'Phase 12B service worker uses an explicit versioned shell cache');",
            "ok(/CACHE_PREFIX = 'workout-game-shell-'/.test(phase12bSw) && /const CACHE_VERSION = 'v13-2'/.test(phase12bSw), 'current service worker retains an explicit versioned shell cache');",
          );

          const cleanValidator = 'scripts/validate-project-clean.cjs';
          replaceOnce(
            cleanValidator,
            "if (!/const\\s+CACHE_VERSION\\s*=\\s*['\"]v13-1['\"]/.test(serviceWorker)) {\n  fail('Phase 15.1 must declare service-worker cache version v13-1');\n}",
            "if (!/const\\s+CACHE_VERSION\\s*=\\s*['\"]v13-2['\"]/.test(serviceWorker)) {\n  fail('current service worker must declare cache version v13-2');\n}",
          );
          replaceOnce(
            cleanValidator,
            "if (!/15\\.6 Profile\\/Settings \\+ notification preferences .*IN PROGRESS/.test(roadmap)) {\n  fail('roadmap must mark the Profile/Settings + notification preferences phase in progress');\n}\nfor (const heading of [\n  '15.6A Profile/Settings foundation — DONE',\n  '15.6B Notification preference persistence — LATER',\n  '15.6C PWA notification permission + delivery integration — LATER',\n  '15.6D Settings integration gate — LATER',\n]) {",
            "if (!/15\\.6 Profile\\/Settings \\+ notification preferences .*DONE/.test(roadmap)) {\n  fail('roadmap must mark the Profile/Settings + notification preferences phase done');\n}\nfor (const heading of [\n  '15.6A Profile/Settings foundation — DONE',\n  '15.6B Notification preference persistence — DONE',\n  '15.6C PWA notification permission + delivery integration — DONE',\n  '15.6D Settings integration gate — DONE',\n]) {",
          );
          replaceOnce(
            cleanValidator,
            "const phase156aScreen = read('src/features/settings/SettingsScreen.tsx');\nconst phase156aProfileForm = read('src/features/settings/ProfileSettingsForm.tsx');",
            "const phase156aScreen = read('src/features/settings/SettingsScreen.tsx');\nconst phase156aNotificationSection = read('src/features/settings/NotificationSettingsSection.tsx');\nconst phase156aProfileForm = read('src/features/settings/ProfileSettingsForm.tsx');",
          );
          replaceOnce(
            cleanValidator,
            "for (const heading of ['Profile picture', 'Notifications', 'Security', 'Groups', 'Privacy & data']) {\n  if (!phase156aScreen.includes(heading)) fail('Phase 15.6A Settings surface missing section: ' + heading);\n}\nif (/type=[\"']checkbox[\"']|role=[\"']switch[\"']/.test(phase156aScreen + phase156aProfileForm)) {\n  fail('Phase 15.6A must not expose notification toggles before persistence and delivery exist');\n}",
            "for (const heading of ['Profile picture', 'Security', 'Groups', 'Privacy & data']) {\n  if (!phase156aScreen.includes(heading)) fail('Settings surface missing section: ' + heading);\n}\nif (!phase156aScreen.includes('NotificationSettingsSection') || !phase156aNotificationSection.includes('Notifications')) {\n  fail('Settings must compose the extracted Notifications section');\n}\nfor (const control of ['Badges & achievements', 'Personal records', 'Group invitations']) {\n  if (!phase156aNotificationSection.includes(control)) fail('Notifications surface missing supported control: ' + control);\n}\nif (!/role=[\"']switch[\"']/.test(phase156aNotificationSection)) {\n  fail('supported notification categories must expose real switches');\n}\nif (/type=[\"']checkbox[\"']|role=[\"']switch[\"']/.test(phase156aProfileForm)) {\n  fail('profile form must not absorb notification controls');\n}",
          );
          replaceOnce(
            cleanValidator,
            "  phase156aScreen + phase156aProfileForm + phase156aDeletion,",
            "  phase156aScreen + phase156aNotificationSection + phase156aProfileForm + phase156aDeletion,",
          );

          const oldCiStart = "const ciWorkflow = read('.github/workflows/ci.yml');";
          const oldPhase16 = "if (!/Phase 16 .*Mobile-first visual overhaul .*LATER/.test(roadmap)) fail('roadmap must include the mobile-first visual overhaul');";
          const currentCiAndPhase16 = `const ciWorkflow = read('.github/workflows/ci.yml');
const supabaseConfig = read('supabase/config.toml');
const hostedAggregateSentinel = read('supabase/tests/_all-hosted-tests.sql');
const ciDoc = read('docs/CI-VALIDATION.md');
const currentPackageJson = JSON.parse(read('package.json'));
if (currentPackageJson.scripts?.['db:test']) {
  fail('ambiguous db:test script must stay removed; the supported repository gate is db:test:ci');
}
if (!String(currentPackageJson.scripts?.['db:test:ci'] || '').includes('validate-db-ci.cjs')
    || !String(currentPackageJson.scripts?.['db:test:ci'] || '').includes('validate-phase15-6b.cjs')
    || !String(currentPackageJson.scripts?.['db:test:ci'] || '').includes('validate-phase15-6c.cjs')) {
  fail('db:test:ci must retain the current static database contract validators');
}
for (const command of [
  'npm ci',
  'npm run typecheck',
  'npm test',
  'npm run test:integration',
  'npm run build',
  'npm run test:structure',
  'npm run test:internal',
  'npx playwright install --with-deps chromium webkit',
  'npm run test:e2e',
  'npm run db:test:ci',
]) {
  if (!ciWorkflow.includes(command)) fail(\`GitHub CI missing required gate command: \${command}\`);
}
for (const staleCommand of [
  'npx supabase start',
  'npx supabase db reset',
  'npm run db:test:local',
  'npx supabase db lint --level warning',
]) {
  if (ciWorkflow.includes(staleCommand)) fail(\`GitHub CI must not retain stale local-Supabase command text: \${staleCommand}\`);
}
if (!/node-version:\\s*24/.test(ciWorkflow)) fail('GitHub CI must match the Node 24 release environment');
if (/if \\[ ! -f supabase\\/config\\.toml \\]; then npx supabase init; fi/.test(ciWorkflow)) {
  fail('GitHub CI must use the committed deterministic Supabase config instead of generating one ad hoc');
}
if (!/project_id\\s*=\\s*\"fitness-game-pwa\"/.test(supabaseConfig)
    || !/major_version\\s*=\\s*17/.test(supabaseConfig)
    || !/site_url\\s*=\\s*\"http:\\/\\/localhost:5173\"/.test(supabaseConfig)) {
  fail('committed Supabase CLI config must remain non-secret, Postgres-17 aligned, and Vite-auth compatible');
}
const sentinelPlans = (hostedAggregateSentinel.match(/select\\s+plan\\(/gi) || []).length;
if (sentinelPlans !== 1 || /-- ={10,}\\s*\\n-- 00\\d_/m.test(hostedAggregateSentinel)) {
  fail('_all-hosted-tests.sql must remain a one-plan compatibility sentinel, never a concatenated pgTAP bundle');
}
if (!/Only files matching this convention are canonical database suites/.test(ciDoc)
    || !/does not require Docker|Docker.*not part/i.test(ciDoc)
    || !/supabase\\/tests\\/\\*\\.test\\.sql/.test(ciDoc)) {
  fail('CI documentation must preserve canonical test discovery and the hosted-Supabase/no-Docker workflow');
}

if (!/Phase 16 .*Mobile-first visual overhaul .*NEXT/.test(roadmap)) fail('roadmap must mark the mobile-first visual overhaul next');`;
          replaceSection(cleanValidator, oldCiStart, oldPhase16, currentCiAndPhase16);

          replaceToEnd(
            cleanValidator,
            '// The historical v0.12.1 structural validator was written after the broken',
            `// The baseline structural validator has been reconciled to current repository state.
require('./validate-project.cjs');

console.log('Release validation passed: clean migration history, current PWA/cache state, Phase 15 admin/capacity/account/messaging/security invariants, completed Phase 15.6 Settings/notification contracts, Docker-free GitHub CI/database discovery, the Phase 16 handoff, and production chunk-budget guards are present.');
`,
          );

          replaceOnce(
            'public/sw.js',
            "// Historical Phase 12B shell checkpoint: v12b-2. Current releases advance CACHE_VERSION below.\n",
            '',
          );
          replaceOnce(
            '.github/workflows/ci.yml',
            "# Legacy structural-validator compatibility only. These lines are comments and\n# MUST NOT become executable CI steps. Runtime DB validation is hosted-Supabase authoritative.\n# npx supabase start\n# npx supabase db reset\n# npm run db:test:local\n# npx supabase db lint --level warning\n\n",
            '',
          );

          const wrapperPath = 'scripts/run-structural-validation.cjs';
          const wrapper = read(wrapperPath);
          const compatibilityMarker = '// validate-project-clean.cjs is an older Phase 15.6A checkpoint validator with';
          const compatibilityIndex = wrapper.indexOf(compatibilityMarker);
          if (compatibilityIndex === -1) throw new Error('unable to find structural compatibility marker');
          let currentGate = wrapper.slice(0, compatibilityIndex).trimEnd();
          currentGate += `\n\nfor (const [file, staleFragments] of [
  ['scripts/validate-project-clean.cjs', ['v13-1', '15.6B Notification preference persistence — LATER', '15.6C PWA notification permission + delivery integration — LATER', '15.6D Settings integration gate — LATER', 'Mobile-first visual overhaul .*LATER']],
  ['scripts/validate-project.cjs', ['0.12.1', '20260822000200_fix_lifting_calendar_summaries.sql', 'v12b-2']],
  ['public/sw.js', ['v12b-2']],
  ['.github/workflows/ci.yml', ['npx supabase start', 'npx supabase db reset', 'npm run db:test:local', 'npx supabase db lint --level warning']],
]) {
  const text = fs.readFileSync(path.join(root, file), 'utf8');
  for (const stale of staleFragments) {
    if (text.includes(stale)) throw new Error(\`Stale structural assertion cleanup failed: \${file} still contains \${stale}\`);
  }
}

console.log('Current Phase 15.6/16 structural gate passed with no legacy assertion shims.');\n`;
          write('scripts/validate-phase15-6d.cjs', currentGate);
          fs.rmSync(wrapperPath);

          const packagePath = 'package.json';
          const packageJson = JSON.parse(read(packagePath));
          packageJson.scripts['test:structure'] = 'node scripts/validate-project-clean.cjs && node scripts/validate-phase15-6d.cjs';
          write(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
      - name: Validate cleaned structural gates
        run: npm run test:structure
      - name: Commit maintenance result
        run: |
          git rm .github/workflows/maintenance-stale-assertions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: remove stale structural assertions"
          git push origin HEAD:maintenance/stale-assertion-cleanup
