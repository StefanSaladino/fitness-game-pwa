name: Phase 16 roadmap reconcile

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'phase16.1-app-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase16.1-app-shell
          fetch-depth: 0
      - name: Reconcile roadmap and remove transformer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()

          replacements = [
              ('### 16.0 Visual inventory + mobile design-system direction — NEXT',
               '### 16.0 Visual inventory + mobile design-system direction — DONE'),
              ('### 16.1 App shell + primary navigation\n',
               '### 16.1 App shell + primary navigation — DONE\n'),
              ('### 16.2 Authentication + password recovery\n',
               '### 16.2 Authentication + password recovery — NEXT\n'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected roadmap anchor not found: {old}')
              text = text.replace(old, new, 1)

          marker_160 = '- produce baseline before/after references so later slices can be judged consistently.\n'
          if marker_160 not in text:
              raise SystemExit('Phase 16.0 closeout marker not found')
          text = text.replace(marker_160, marker_160 + '\nSee `docs/PHASE16.0-VISUAL-INVENTORY-DIRECTION.md`.\n', 1)

          marker_161 = '- no page-specific content redesign yet.\n'
          if marker_161 not in text:
              raise SystemExit('Phase 16.1 closeout marker not found')
          text = text.replace(marker_161, marker_161 + '\nSee `docs/PHASE16.1-APP-SHELL.md`.\n', 1)

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase16-roadmap-reconcile.yml
          git add docs/ROADMAP.md
          git diff --cached --check
          git commit -m "docs: close Phase 16.0 and 16.1 roadmap state"
          git push origin HEAD:phase16.1-app-shell
