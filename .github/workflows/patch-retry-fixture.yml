name: Patch retry fixture

on:
  push:
    branches:
      - fix/no-docker-database-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-docker-database-gate
      - name: Make restart retry fixture deterministic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/workout-reliability-journey.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = """    firstRender.unmount();
    renderWorkout(backend);

    expect(await screen.findByText('1 workout change queued')).toBeInTheDocument();
    await waitFor(() => expect(screen.queryByText('1 workout change queued')).not.toBeInTheDocument(), { timeout: 4_000 });
"""
          new = """    firstRender.unmount();
    const retryReady = { ...persistedBeforeRestart!, lastAttemptAtMs: Date.now() - 2_000 };
    expect(await mutationStorage.save(USER_ID, [retryReady])).toBe(true);
    renderWorkout(backend);

    expect(await screen.findByText('1 workout change queued')).toBeInTheDocument();
    await waitFor(() => expect(screen.queryByText('1 workout change queued')).not.toBeInTheDocument());
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one restart fixture block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-retry-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/workout-reliability-journey.test.tsx .github/workflows/patch-retry-fixture.yml
          git commit -m "test: make restart retry fixture deterministic"
          git push origin HEAD:fix/no-docker-database-gate
